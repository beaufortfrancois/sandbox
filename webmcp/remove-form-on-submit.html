<button id="button">Crash tab</button>

<form id="form" toolautosubmit toolname="crash_tab" tooldescription="Crash this tab"></form>

<script>
    button.onclick = () => {
        navigator.modelContextTesting.executeTool('crash_tab', '{}')
    }
    form.onsubmit = (event) => {
        event.preventDefault();
        event.respondWith('form submitted before form.remove() is called');
        form.remove();
    };
</script>
