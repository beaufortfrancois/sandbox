<script>
  // https://web.dev/articles/more-capable-form-controls
  class MyControl extends HTMLElement {
    static get formAssociated() {
      return true;
    }

    constructor() {
      super();
      this.internals_ = this.attachInternals();
      this.value_ = '';
    }

    get value() {
      return this.value_;
    }
    set value(v) {
      this.internals_.setFormValue(v);
      this.value_ = v;
    }
    setValues(nameValues) {
      const formData = new FormData();
      for (let p of nameValues) {
        formData.append(p[0], p[1]);
      }
      this.internals_.setFormValue(formData);
    }
  }
  customElements.define('my-control', MyControl);

  targetCheckbox.onchange = () => {
      document.querySelector('form').target = targetCheckbox.checked ? "target" : "";
      document.querySelector('form').action = targetCheckbox.checked ? "print-url.html" : "";
  }

  toolAutoSubmitCheckbox.onchange = () => {
    if (toolAutoSubmitCheckbox.checked) {
      document.querySelector('form').setAttribute('toolautosubmit');
    } else {
      document.querySelector('form').removeAttribute('toolautosubmit');
    }
  }

  document.querySelector('[name=my-control]').value = 'my-control-value';
  document.querySelector('[name=my-control2]').setValues([
    ['my-control2-sub1', 'subvalue1'],
    ['my-control2-sub2', 'subvalue2'],
  ]);

  document.querySelector('form').addEventListener('formdata', ({ formData }) => {
    formData.append('my-form-data', 'my-form-data-value');
  });

  document.querySelector('form').addEventListener('submit', (e) => {
    console.log(`e.agentInvoked: ${e.agentInvoked}`);
    
    if (preventDefaultCheckbox.checked) {
      e.preventDefault();
      e.respondWith(formResponse.value);
    }
  });
</script>
