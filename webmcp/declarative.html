<script>
  const jsonLd = document.querySelector('script[type="application/ld+json"]');
  const data = JSON.parse(jsonLd.textContent);
  data.text = location.search;
  jsonLd.textContent = JSON.stringify(data);
</script>
<script>
  class MyControl extends HTMLElement {
    static get formAssociated() {
      return true;
    }

    constructor() {
      super();
      this.internals_ = this.attachInternals();
      try {
        this.internals_.setToolParamSchema(`{ "type":"string" }`);
      } catch (e) {}
      this.value_ = '<none>';
      this.attachShadow({ mode: 'open' });
      let div = document.createElement('div');
      this.shadowRoot.append(div);
      this.render();
    }

    toolFillCallback(value) {
      this.value = value;
    }

    render() {
      this.shadowRoot.querySelector('div').textContent = `my-control value: ${this.value_}`;
    }

    get value() {
      return this.value_;
    }
    set value(v) {
      this.internals_.setFormValue(v);
      this.value_ = v;
      this.render();
    }
  }
  customElements.define('my-control', MyControl);

  document.querySelector('[name=my-control]').value = 'my-control-value';
  const formData = new FormData();
  formData.append('my-control2-sub1', 'subvalue1');
  formData.append('my-control2-sub2', 'subvalue2');
  document.querySelector('[name=my-control2]').value = formData;
</script>

<script>
  [...document.querySelectorAll('form *')].forEach((element) => {
    if ('onchange' in element.__proto__) {
      element.addEventListener('change', (e) => console.log(e));
    }
    if ('oninput' in element.__proto__) {
      element.addEventListener('input', (e) => console.log(e));
    }
  });

  window.addEventListener('toolactivated', (event) => {
    console.log(event);
  });

  window.addEventListener('toolcancel', (event) => {
    console.log(event);
  });

  targetCheckbox.onchange = () => {
    document.querySelector('form').target = targetCheckbox.checked ? 'target' : '';
    document.querySelector('form').action = targetCheckbox.checked
      ? './print-url.html'
      : './declarative.html';
  };

  toolAutoSubmitCheckbox.onchange = () => {
    if (toolAutoSubmitCheckbox.checked) {
      document.querySelector('form').setAttribute('toolautosubmit', '');
    } else {
      document.querySelector('form').removeAttribute('toolautosubmit');
    }
  };

  document.querySelector('form').addEventListener('formdata', ({ formData }) => {
    formData.append('my-form-data', 'my-form-data-value');
  });

  document.querySelector('form').addEventListener('submit', async (e) => {
    console.log(`e.agentInvoked: ${e.agentInvoked}`);

    if (preventDefaultCheckbox.checked) {
      e.preventDefault();
      e.respondWith(formResponse.value);
    }

    try {
      const file = file1.files[0];
      console.log(`file: ${file}`);
      console.log(await file.text());
    } catch (e) {}
  });
</script>
