<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Step 1: Shipping Address</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h2>Shipping Address</h2>

    <form id="shipping-form" action="billing.html">
      <div class="form-group">
        <label for="street">Street Address</label>
        <input type="text" id="street" placeholder="1600 Amphitheatre Pkwy" />
      </div>

      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" placeholder="Mountain View" />
      </div>

      <button type="submit">Proceed to Billing</button>
    </form>

    <!-- Load the WebMCP connection and register this page's tool step -->
    <script src="webmcp-client.js"></script>
    <script>
      connectToWorker({
        FILL_SHIPPING: ({ street, city }) => {
          document.querySelector('#street').value = street;
          document.querySelector('#city').value = city;
        },
      });
    </script>
  </body>
</html>
