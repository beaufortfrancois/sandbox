<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cross-document tool invocation</title>
    <style>
      iframe {
        width: 100%;
        height: 400px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <button id="checkout">Execute checkout tool</button>
    <pre id="result"></pre>

    <!-- The iframe connects to the shared worker that registers the tool -->
    <iframe src="shipping.html"></iframe>

    <script>
      document.querySelector('#checkout').onclick = async () => {
        const input = {
          shippingAddress: { street: '1600 Amphitheatre Pkwy', city: 'Mountain View' },
          paymentDetails: { cardNumber: '1111-2222-3333-4444' },
        };
        const [tool] = await document.modelContext.getTools();
        const result = await document.modelContext.executeTool(tool, input);
        document.querySelector('#result').textContent = result;
      };
    </script>
  </body>
</html>
