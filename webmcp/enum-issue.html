<label>
  Register <code>"color_name_to_color_id"</code> tool.
  <input id="checkbox" type="checkbox" />
</label>
<hr />
<p style="user-select: all">Add the white color</p>
<form toolname="form_add_color" tooldescription="Add color" toolautosubmit>
  <select required name="id" toolparamtitle="color_id" toolparamdescription="The color ID to add. Match the desired color using the oneOf titles — each title is the color name (e.g. Blue) and its const value is the corresponding color ID to use.">
    <option value="1">Blue</option>
    <option value="2">White</option>
    <option value="3">Red</option>
  </select>
</form>
<script>
  document.querySelector('form').onsubmit = (e) => {
    e.preventDefault();
    pre.textContent = `${document.querySelector('id').value}`;
  }
</script>
<pre id="pre"></pre>
<script>
  function getColor(id) {
    if (id === '1') return 'Blue';
    if (id === '2') return 'White';
    if (id === '3') return 'Red';
    return `unrecognized id`;
  }
  const inputSchema = {
    type: 'object',
    properties: {
      id: {
        type: 'string',
        title: 'color_id',
        description:
          'The color ID to add. Match the desired color using the oneOf titles — each title is the color name (e.g. Blue) and its const value is the corresponding color ID to use.',
        oneOf: [
          { const: '1', title: getColor('1') },
          { const: '2', title: getColor('2') },
          { const: '3', title: getColor('3') },
        ],
        enum: ['1', '2', '3'],
      },
    },
    required: ['id'],
  };

  navigator.modelContext.registerTool({
    name: 'add_color',
    description: 'Add color',
    inputSchema,
    execute: ({ id }) => {
      pre.textContent = `Tool was executed with "${getColor(id)}" ({id: "${id}"})`;
      return `The ${getColor(id)} color was added.`;
    },
  });

  checkbox.onchange = () => {
    if (!checkbox.checked) {
      navigator.modelContext.unregisterTool('color_name_to_color_id');
      return;
    }
    navigator.modelContext.registerTool({
      name: 'color_name_to_color_id',
      description: 'Maps color name to color ID',
      inputSchema: {
        type: 'object',
        properties: {
          color_name: {
            type: 'string',
            description: 'The color name (e.g. Blue)',
          },
        },
      },
      required: ['color_name'],
      execute: ({ color_name }) => {
        const results = inputSchema.properties.id.oneOf.filter(
          (i) => i.title.toLowerCase() == color_name.toLowerCase(),
        );
        if (results.length) {
          return results[0].const;
        }
        return 'The color name is invalid';
      },
    });
  };
</script>
