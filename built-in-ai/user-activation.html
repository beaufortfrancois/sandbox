<button id="button">log in 6 seconds</button>
<pre id="preUserActivation"></pre>
<pre id="preAvailability"></pre>
<pre id="preLanguageModel"></pre>
<script type="module">
  function log() {
    const timestamp = `${Math.round((new Date() - startDate) / 1000)}s`;

    preUserActivation.textContent += `[${timestamp}] navigator.userActivation.hasBeenActive: ${navigator.userActivation.hasBeenActive} | navigator.userActivation.isActive: ${navigator.userActivation.isActive}\n`;

    const options = { expectedOutputs: [{ type: 'text', languages: ['en'] }] };

    logAvailability(timestamp, "...");
    try {
      LanguageModel.availability(options).then(
        (availability) => logAvailability(timestamp, `"${availability}"`),
        (error) => logAvailability(timestamp, error)
      );
    } catch (error) {
      logAvailability(timestamp, error);
    }

    logLanguageModel(timestamp, "...");
    try {
      LanguageModel.create(options).then(
        (languageModel) => logLanguageModel(timestamp, languageModel),
        (error) => logLanguageModel(timestamp, error)
      );
    } catch (error) {
      logLanguageModel(timestamp, error);
    }
  }

  const startDate = new Date();
  log();
  button.onclick = () => {
    // log();
    setTimeout(log, 6000);
  };

  function logAvailability(timestamp, text) {
    preAvailability.textContent += `[${timestamp}] LanguageModel.availability(): ${text}\n`;
  }
  function logLanguageModel(timestamp, text) {
    preLanguageModel.textContent += `[${timestamp}] LanguageModel.create(): ${text}\n`;
  }
</script>
