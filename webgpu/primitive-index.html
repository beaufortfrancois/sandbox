<canvas id="canvas" width="512" height="512"></canvas>
<script type="module">
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter.features.has("primitive-index")) {
    throw new Error("Primitive index support is not available");
  }
  // Explicitly request primitive index support.
  const device = await adapter.requestDevice({
    requiredFeatures: ["primitive-index"],
  });

  const context = canvas.getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format });

  const code = `
    enable primitive_index;

    @vertex 
    fn vertexMain(@builtin(vertex_index) i : u32) -> @builtin(position) vec4f {
        var pos = array(vec2f(0, 0.5), vec2f(-0.5, -0.5), vec2f(0.5, -0.5), vec2f(0, 0.5));
        return vec4f(pos[i], 0, 1);
    }

    @fragment
    fn main(@builtin(primitive_index) i : u32) -> @location(0) vec4f {
      if (i == 1) {
        return vec4f(1, 0, 0, 1);
      }
      return vec4f(1, 1, 0, 1);
    }`;
  const module = device.createShaderModule({ code });
  const pipeline = await device.createRenderPipelineAsync({
    layout: "auto",
    vertex: { module },
    fragment: { module, targets: [{ format }] },
    primitive: {
      topology: "line-strip",
    }
  });
  const commandEncoder = device.createCommandEncoder();
  const colorAttachments = [
    {
      view: context.getCurrentTexture().createView(),
      loadOp: "clear",
      storeOp: "store",
    },
  ];
  const passEncoder = commandEncoder.beginRenderPass({ colorAttachments });
  passEncoder.setPipeline(pipeline);
  passEncoder.draw(4);
  passEncoder.end();
  device.queue.submit([commandEncoder.finish()]);
</script>
