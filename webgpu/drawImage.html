<canvas id="canvas1" width="512" height="512"></canvas>
<canvas id="canvas2" width="512" height="512"></canvas>
<script type="module">
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();

  const webgpuContext = canvas1.getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  webgpuContext.configure({ device, format });

  const code = `
    @vertex fn vertexMain(@builtin(vertex_index) i : u32) ->
      @builtin(position) vec4f {
        var pos = array(vec2f(0, 1), vec2f(-1, -1), vec2f(1, -1));
        return vec4f(pos[i], 0, 1);
    }
    @fragment fn fragmentMain() -> @location(0) vec4f {
      return vec4f(1, 0, 0, 1);
    }`;
  const module = device.createShaderModule({ code });
  const pipeline = await device.createRenderPipelineAsync({
    layout: "auto",
    vertex: { module },
    fragment: { module, targets: [{ format }] },
  });
  const commandEncoder = device.createCommandEncoder();
  const colorAttachments = [
    {
      view: webgpuContext.getCurrentTexture().createView(),
      loadOp: "clear",
      storeOp: "store",
    },
  ];
  const passEncoder = commandEncoder.beginRenderPass({ colorAttachments });
  passEncoder.setPipeline(pipeline);
  passEncoder.draw(3);
  passEncoder.end();
  device.queue.submit([commandEncoder.finish()]);

  // console.log(canvas1.toDataURL());

  {
    // Regular onscreen canvas.
    const context = canvas2.getContext("2d");
    context.drawImage(canvas1, 0, 0);
    console.log(canvas2.toDataURL());

    const imageData = context.getImageData(0, 0, canvas2.width, canvas2.height);
    console.log(imageData);
  }
  {
    // Canvas created but not displayed on screen.
    const canvas3 = document.createElement('canvas');
    canvas3.width = canvas1.width;
    canvas3.height = canvas1.height;
    const offscreenContext = canvas3.getContext("2d");
    offscreenContext.drawImage(canvas1, 0, 0);
    console.log(canvas3.toDataURL());

    const imageData = offscreenContext.getImageData(0, 0, canvas2.width, canvas2.height);
    console.log(imageData);
    await new Promise(r => setTimeout(r, 1000));
    document.body.append(canvas3);
  }
</script>
